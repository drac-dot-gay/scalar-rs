[package]
name = "scalar-surreal"
license = "MIT OR Apache-2.0"
description = "surrealdb driver for scalar, a data oriented, [I'M NOT GOING TO SAY IT], ergonomic cms system"
version = "0.1.2"
edition = "2021"

[features]
oidc = [
"scalar-cms/oidc",
"dep:openidconnect"
]

[dependencies]
num-traits = { version = "0.2.19", features = ["i128"] }
openidconnect = { workspace = true, optional = true }
scalar-cms = { version = "0.1", path = "../scalar-cms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "3", default-features = false }
tracing = "0.1"

[dev-dependencies]
rstest = "0.26"
surrealdb = { version = "3", default-features = false, features = [
    "protocol-ws",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
