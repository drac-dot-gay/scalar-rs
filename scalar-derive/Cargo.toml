[package]
name = "scalar-derive"
license = "MIT OR Apache-2.0"
description = "derive macros for scalar, a data oriented, [I'M NOT GOING TO SAY IT], ergonomic cms system"
authors = ["drac <drac@drac.gay>"]
version = "0.2.0"
