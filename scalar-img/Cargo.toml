[package]
name = "scalar-img"
license.workspace = true
description = "s3 based image storage for scalar, a data oriented, [I'M NOT GOING TO SAY IT], ergonomic cms system"
authors = ["drac <drac@drac.gay>"]
version = "0.2.0"
edition = "2021"

[features]
s3 = [
    "dep:rust-s3"
]

[dependencies]
base64-url = "3"
bytes = "1"
image = { version = "0.25" }
image_hasher = "3"
rust-s3 = {version = "0.37", optional = true}
scalar-cms = { version = "0.2", path = "../scalar-cms", features = ["url"] }
serde = {workspace = true}
thiserror = {workspace = true}
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
